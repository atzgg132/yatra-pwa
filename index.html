<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Yatra" />
  <meta name="application-name" content="Yatra" />
  <meta name="theme-color" content="#EA2330" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Yatra — flights, hotels, holidays, buses and trains" />
  <title>Yatra</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">
      <div class="statusbar" id="statusbar">
        <span id="clock">9:41</span>
        <span class="sig">
          <span class="dotbar"><i></i><i></i><i></i><i></i></span>
          <span class="bat"><b></b></span>
        </span>
      </div>
      <div class="app" id="app"></div>
      <nav class="tabbar hidden" id="tabbar"></nav>
      <div class="toast" id="toast"></div>
      <div class="splash" id="splash">
        <img src="assets/yatra-logo.svg" alt="Yatra" />
      </div>
    </div>
  </div>
  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
